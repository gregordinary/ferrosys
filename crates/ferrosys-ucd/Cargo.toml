license = "Unicode-3.0"
homepage.workspace = true
repository.workspace = true
keywords = ["unicode", "ucd", "apfs", "normalization", "case-folding"]
categories = ["text-processing", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/ferrosys-ucd"
