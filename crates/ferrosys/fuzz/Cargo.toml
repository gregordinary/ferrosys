# Fuzz targets for the reader, built and run with cargo-fuzz on a nightly
# toolchain. This is a standalone package with its own `[workspace]`, so the
# crate's ordinary build never compiles it.
[package]
name = "ferrosys-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `tar` for the archive target: the parser reads untrusted input, so it is fuzzed
# alongside the readers rather than left to the crate's own tests. `fat`, `exfat`, and
# `btrfs` for those families' reader targets, none of which is in the default feature set.
# The three compression features so the btrfs target reaches the decoders — without them
# `read_data` answers `UnsupportedCompression` before a decoder runs, and the fuzzer
# exercises the refusal instead of the code the contract is about.
ferrosys = { path = "..", features = ["tar", "fat", "exfat", "btrfs", "lzo", "zlib", "zstd"] }

[[bin]]
name = "reader_scan"
path = "fuzz_targets/reader_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reader_inspect"
path = "fuzz_targets/reader_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fat_reader"
path = "fuzz_targets/fat_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exfat_reader"
path = "fuzz_targets/exfat_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "btrfs_reader"
path = "fuzz_targets/btrfs_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_parse"
path = "fuzz_targets/archive_parse.rs"
test = false
doc = false
bench = false

# Detach from the crate's workspace: cargo-fuzz builds this package on its own.
[workspace]
