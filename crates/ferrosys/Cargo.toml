[package]
name = "ferrosys"
# Every format is spelled in full: a registry search for `ext4` or `fat32` matches this
# line word for word, and `ext2/3/4` is no word at all.
description = "Pure-Rust filesystem formatter and reader: ext4, ext3, ext2, FAT32, FAT16, FAT12, exFAT, btrfs, and APFS — rootless, in userspace, byte-reproducible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Five is the registry's limit. Its search reads the description, which spells every format,
# so a keyword earns its slot by the page it lists the crate on: a family's name is a page of a
# few dozen crates, the one someone who needs that format looks at. Four families take four
# slots, the ones fewest other crates write: ext4, APFS, btrfs and exFAT. FAT32, which many
# crates write, is found through the description. `disk-image` takes the fifth: it is what
# someone building boot media, a virtual machine's disk, or an embedded root filesystem looks
# for, and the one word here that names the artifact and not a format. `mkfs` is the binary's,
# one crate over, where a search for the tool being replaced lands. `filesystem` is in
# `categories` and in the description, both of which that search reads.
keywords = ["ext4", "apfs", "btrfs", "exfat", "disk-image"]
# `virtualization` because a microVM root disk is a filesystem image built by a program
# rather than by a person, which is this crate's shape of consumer.
categories = ["filesystem", "os", "virtualization"]
# The crate's front page on a registry. Its example is compiled as a doctest, so what
# a reader sees there is what the API accepts.
readme = "README.md"
documentation = "https://docs.rs/ferrosys"

[features]
# The families a build carries. With none of them the crate root holds only the
# family-agnostic substrate — the `crc32c` primitive, the byte accessors, the `Filesystem` /
# `detect` selector, and the source and extraction vocabulary — and `detect` recognizes
# nothing.
#
# The default carries the four families a Linux kernel mounts and the three decoders they
# read, so a default build reads a compressed btrfs root and compiles code under MIT OR
# Apache-2.0 alone. APFS and the three decoders its files alone use are named, as
# `features = ["apfs", "lzvn", "lzfse", "lzbitmap"]`, and two of them carry a license of their
# own through the crate each depends on: `apfs` the Unicode License v3, and `lzvn` and `lzfse`
# BSD-3-Clause. A consumer that wants fewer families turns the default off and names them.
default = ["ext", "fat", "exfat", "btrfs", "zlib", "lzo", "zstd"]
# The ext2/ext3/ext4 family: the formatter, the reader, and the byte-exact on-disk
# structures, reached through the `ext` module.
ext = []
# The FAT12/FAT16/FAT32 family, reached through the `fat` module. Granularity is per
# family rather than per format — the three FATs are one lineage sharing a BIOS parameter
# block, a directory format, and a cluster heap, differing only in the width of a FAT entry
# and in where the root directory sits.
fat = []
# The exFAT family, reached through the `exfat` module. It is a family of its own rather
# than a member of that one: the two share the word "cluster" and no bytes — a different
# boot region, a different directory entry format, a different name encoding, and an
# allocation bitmap FAT has no concept of.
exfat = []
# The btrfs family, reached through the `btrfs` module. It shares no structure with any of
# the three above: a copy-on-write filesystem built out of B-trees over a logical address
# space, where a chunk tree maps that space onto the device and every metadata block
# carries its own checksum.
btrfs = []
# The APFS family, reached through the `apfs` module: a container of volumes, each a tree of
# records found through an object map, under a checkpoint. It shares no structure with any of
# the four above. It depends on `ferrosys-ucd`, the Unicode Character Database tables a
# volume's names are compared with, which are under the Unicode License v3.
apfs = ["dep:ferrosys-ucd"]
# The tar/PAX archive `Source` and `Sink`. Off by default; enabling it pulls in the `tar`
# crate (no default features, so no host-side xattr writes) for parsing archives, their PAX
# timestamps and xattrs, and SCHILY ACL records. It names no family: a source feeds
# whichever family is being written, and a sink drains whichever one was opened.
tar = ["dep:tar"]
# The host-directory `Source` and `Sink`: the walk that turns a tree on this machine into
# the entries a format writes, and the extraction that writes a filesystem's contents back
# out as a tree. Off by default; enabling it pulls in `rustix` for the directory, node,
# ownership and extended-attribute calls the standard library has no equivalent of. Both
# ends read and write Linux inode metadata and Linux extended attributes, so they are
# present on Linux. Like `tar`, neither end names a family.
dir = ["dep:rustix"]
# The ways a filesystem stores a run of bytes in fewer of them, each behind its own
# feature. A build carrying one reads a file whose extents are encoded that way; a build
# without it reports such a file as one it does not decode, naming the algorithm, rather
# than handing back the bytes on the volume as though they were the file's. Verification is
# unaffected either way — the checksums a filesystem records cover the bytes it stored, so
# they are checked without any of this.
#
# Named for the algorithm rather than for a family, as `tar` and `dir` are named for what
# they are: an encoding is a property of a run of bytes and not of the format around it, and
# the decoder is at the crate root beside `crc32c` for the same reason. btrfs and APFS are
# the families that read them, so a build wanting one wants one of those beside it.
#
# DEFLATE, as `zlib` frames it. The dependency is `#![forbid(unsafe_code)]`, which is this
# crate's own bar.
zlib = ["dep:miniz_oxide"]
# LZO1X, in the block form btrfs frames it with. It takes no dependency: the decoder is
# small, well-specified, and written here in safe Rust, which is what this crate does with
# `crc32c` and the directory hashes for the same reasons.
lzo = []
# Zstandard. The dependency decodes only, and carries `unsafe` in a ring buffer of its own —
# the one place the default build's dependency graph departs from this crate's own bar,
# taken because the alternative for this format is a C library.
zstd = ["dep:ruzstd"]
# LZVN, an encoding an APFS compressed file keeps its content in. The decoder is
# `ferrosys-lzfse`'s, in safe Rust, derived from the one in Apple's lzfse project and under
# its BSD-3-Clause license.
lzvn = ["dep:ferrosys-lzfse"]
# LZFSE, another, decoded by the same crate. A stream of it carries LZVN blocks among its own,
# so it turns `lzvn` on.
lzfse = ["lzvn"]
# LZBITMAP, a third. It takes no dependency: the decoder is small and written here in safe
# Rust.
lzbitmap = []
# `Serialize` on the values a consumer embeds in a report of its own: the findings taxonomy
# (`Finding`, `FindingReport`, `Severity`, `Family`), the fidelity report (`FidelityReport`,
# `FidelityRecord`, `Property`, `Direction`), and `Usage`; each family's scan report
# (`ScanReport`, `Anomaly`, `Category`, and its coordinates); each family's planned geometry
# (`Layout`, `FatLayout`, `ExfatLayout`, `BtrfsLayout`, `ApfsLayout`, and the types they hold);
# and the ext feature model (`FeatureSet`, `Profile`). A closed set serializes as the word the
# crate prints for it, and a flag word as the on-disk word it wraps.
# Serialization only — nothing here is deserialized, since these values are read from an
# image or produced by a planner, never reconstructed from a document. The crate's own
# `to_json` / `to_sarif` emitters are unaffected: they stay the schema-versioned canonical
# form, and this is for a consumer whose own document has its own shape. Off by default; it
# covers whatever families the build carries.
serde = ["dep:serde"]

[dependencies]
# Typed error enums. Build-time proc-macro only; no runtime footprint.
thiserror = { workspace = true }
# The archive `Source`, behind the `tar` feature.
tar = { workspace = true, optional = true }
# The `Serialize` derives, behind the `serde` feature.
serde = { workspace = true, optional = true }
# The DEFLATE and Zstandard decoders, behind the `zlib` and `zstd` features. LZO and LZBITMAP
# need no entry here: their decoders are in this crate.
miniz_oxide = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
# The Unicode Character Database tables APFS names are compared with, behind the `apfs`
# feature, under the Unicode License v3.
ferrosys-ucd = { workspace = true, optional = true }
# The LZVN and LZFSE decoders, behind the `lzvn` and `lzfse` features, under BSD-3-Clause.
ferrosys-lzfse = { workspace = true, optional = true }

# The host-directory source and sink's dependency, on the platform whose trees they walk
# and create.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# The `*at` directory calls, `mknodat`, the ownership and mode calls, the timestamp
# calls and the extended-attribute calls, behind the `dir` feature. Default features off
# with only `std` and `fs` on, which on Linux is the direct-syscall backend: the tree it
# brings is `bitflags` and `linux-raw-sys` type definitions, with no C library and no
# build script probing one.
rustix = { workspace = true, optional = true }

[dev-dependencies]
# Scratch image files for the host-tool validation gates; never shipped.
tempfile = { workspace = true }
# Building test archives for the archive-source tests; exercised with `--features tar`.
tar = { workspace = true }
# The writer property gate: generates source trees and geometries, and shrinks a
# failing case to a minimal one. Never shipped.
proptest = { workspace = true }
# Reading back what the `serde` feature's derives emit; exercised with `--features serde`.
serde_json = { workspace = true }
# The compressor behind the LZO decoder's round-trip gate: a second implementation of the
# format, so what the decoder is held against is a stream this crate had no hand in
# producing. Never shipped.
lzokay = { workspace = true }
# Digests of what the APFS corpus gate reads, held to the ones macOS recorded. Never shipped.
sha2 = { workspace = true }

[package.metadata.docs.rs]
# Document every family on docs.rs, APFS included, with the archive and directory sources and
# `serde`.
all-features = true
