[package]
name = "ferrosys-cli"
description = "Command-line formatter, inspector, and extractor for ext4, ext3, ext2, FAT32, FAT16, FAT12, exFAT, and btrfs images, built on ferrosys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Five is the registry's limit, so each family gets the one name someone searches for rather
# than one entry per format; the lineages they cover are in the description, which the
# registry's own search reads. `mkfs` leads because this is the artifact that answers to it:
# someone looking for the command they would otherwise reach for is looking for a binary, and
# the library one crate over spends that slot on `disk-image` instead. `filesystem` is absent,
# being in `categories` already.
keywords = ["mkfs", "ext4", "btrfs", "exfat", "fat32"]
categories = ["command-line-utilities", "filesystem"]
# The package's front page on a registry.
readme = "README.md"
# The guide, not docs.rs: the only target here is a binary with `doc = false`, so a
# rustdoc site for this package would be an empty page.
documentation = "https://gregordinary.github.io/ferrosys/cli.html"

# The binary is `ferrosys`; the package it ships in is `ferrosys-cli`.
# `doc = false`: the binary shares the name of the `ferrosys` library, and rustdoc would
# otherwise write both to the same `target/doc/ferrosys` path. The command line is
# documented in the guide, not in rustdoc.
[[bin]]
name = "ferrosys"
path = "src/main.rs"
doc = false

[dependencies]
# The filesystem itself. The `tar` feature carries the archive source `format --from-tar`
# reads, and `dir` the directory walk behind `format --from-dir`. The integration gates
# build filesystems the archive source cannot describe (a socket) and read them back, so
# they drive the library directly as well as the binary; an integration test links a
# normal dependency, so this one entry serves both.
#
# Every family is named, and that is the deliberate asymmetry between the two crates: the
# library is modular so a consumer wanting one filesystem compiles one, and the binary is
# comprehensive because someone running `detect` or `inspect` on an unknown image wants it
# identified whatever it turns out to be. A family missing here is not a smaller build; it
# is a wrong answer from a shipping command.
#
# The three decoders are on for the same reason every family is. A btrfs someone points this
# binary at is one somebody else's kernel wrote, and every btrfs in use writes compressed
# extents where a mount was given `compress=`; a binary without the decoders would answer
# `extract` on an ordinary root filesystem with a refusal naming an algorithm. Reading a real
# filesystem is what a shipping command is for, so it carries what that takes.
ferrosys = { workspace = true, features = [
    "ext",
    "fat",
    "exfat",
    "btrfs",
    "tar",
    "dir",
    "zlib",
    "lzo",
    "zstd",
] }
# Typed error enums. Build-time proc-macro only; no runtime footprint. Argument
# parsing is hand-written and takes no dependency.
thiserror = { workspace = true }

[dev-dependencies]
# Scratch images and archives for the integration gates; never shipped.
tempfile = { workspace = true }
# Building the tar archives the round-trip gates feed back in, and reading back the ones
# `extract --to-tar` writes. The binary itself needs no tar crate: it writes archives
# through the library's archive sink, which takes a plain writer.
tar = { workspace = true }
