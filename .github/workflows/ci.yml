name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    # Warnings are errors here (style guide: fmt/clippy/rustdoc clean). Scoped to
    # this job so the MSRV build check is not failed by version-specific lints.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the rustfmt/clippy components;
      # rustup installs them on first use.
      - name: Toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The two gates above and the rustdoc gate below all build `--all-features`, which is
      # the one configuration in which nothing a consumer can turn off is off. A reference
      # that names a gated item from code gated differently passes all three and fails for
      # the consumer who selected the narrower build. This lints the configurations where
      # something is missing, including the default one `cargo add ferrosys` gives.
      - name: Library lints clean in every configuration it offers
        run: ci/lint-features.sh

      # The host-tool validation gates (e2fsck, the dumpe2fs differential oracle,
      # the resize2fs matrix) treat e2fsprogs as ground truth, and its geometry
      # defaults and e2fsck strictness are version- and build-dependent. Pin the exact
      # upstream release instead of the runner's rolling package: build it from a
      # sha256-pinned source tarball (cached across runs) and read the pinned
      # ci/mke2fs.conf, so a distro rebuild cannot re-baseline the gates silently.
      - name: Cache pinned e2fsprogs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferrosys/e2fsprogs
          key: e2fsprogs-${{ hashFiles('ci/build-e2fsprogs.sh') }}

      - name: Build e2fsprogs, put it on PATH, pin its config, assert the version
        run: |
          bash ci/build-e2fsprogs.sh
          # Derive the prefix from the script, so the version lives in one place.
          prefix="$(bash ci/build-e2fsprogs.sh --print-prefix)"
          echo "$prefix/sbin" >> "$GITHUB_PATH"
          echo "MKE2FS_CONFIG=$PWD/ci/mke2fs.conf" >> "$GITHUB_ENV"
          # Assert every tool a gate uses reports the pinned version, not mke2fs alone.
          #
          # Captured rather than piped into `grep`. Every `run:` step here is a bash with
          # `-o pipefail`, and `resize2fs -V` prints its version and then exits 1 for want
          # of a device to resize. Piped, the pipeline's status would be the tool's rather
          # than the match's, and that one tool would read as a mismatch however exactly
          # right its banner is. `ci/preflight.sh` probes the same tools the same way.
          for t in mke2fs e2fsck dumpe2fs resize2fs debugfs; do
            banner="$("$prefix/sbin/$t" -V 2>&1 || true)"
            case "$banner" in
              *"$t 1.47.0 "*) ;;
              *) echo "::error::e2fsprogs pin mismatch for $t"; exit 1 ;;
            esac
          done

      # The FAT oracle tier, pinned for the same reason and in the same way. `fsck.fat`
      # decides whether a FAT image is acceptable and `mkfs.fat --invariant` is the
      # baseline a FAT image is compared against byte for byte, so a rolling package
      # would let a distro rebuild re-baseline both. mtools is what populates and reads
      # a FAT image without a mount -- the second implementation that says what is
      # actually in one -- and reads the pinned ci/mtools.conf, so the runner's own
      # mtools configuration cannot reach it.
      - name: Cache pinned dosfstools
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferrosys/dosfstools
          key: dosfstools-${{ hashFiles('ci/build-dosfstools.sh') }}

      - name: Cache pinned mtools
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferrosys/mtools
          key: mtools-${{ hashFiles('ci/build-mtools.sh') }}

      - name: Build dosfstools and mtools, put them on PATH, assert the versions
        run: |
          bash ci/build-dosfstools.sh
          bash ci/build-mtools.sh
          # Derive each prefix from its script, so a version lives in one place.
          dos="$(bash ci/build-dosfstools.sh --print-prefix)"
          mt="$(bash ci/build-mtools.sh --print-prefix)"
          echo "$dos/sbin" >> "$GITHUB_PATH"
          echo "$mt/bin" >> "$GITHUB_PATH"
          echo "MTOOLSRC=$PWD/ci/mtools.conf" >> "$GITHUB_ENV"
          # No two dosfstools binaries agree on how to be asked their version: only
          # fatlabel has a flag, mkfs.fat ends its help with the banner, and fsck.fat
          # prints one only once it starts a check, so it is given a device it fails on.
          #
          # Captured rather than piped, for the reason given above the e2fsprogs loop:
          # `fsck.fat` is the other probe that exits non-zero by design, and under
          # `-o pipefail` a pipeline would report the tool's status instead of the match's.
          assert_banner() {
            local label="$1" want="$2"; shift 2
            local banner; banner="$("$@" 2>&1 || true)"
            case "$banner" in
              *"$want"*) ;;
              *) echo "::error::$label pin mismatch for $want"; exit 1 ;;
            esac
          }
          assert_banner dosfstools "mkfs.fat 4.2 (" "$dos/sbin/mkfs.fat" --help
          assert_banner dosfstools "fsck.fat 4.2 (" "$dos/sbin/fsck.fat" -n /dev/null
          assert_banner dosfstools "fatlabel 4.2 (" "$dos/sbin/fatlabel" --version
          # Every mtools name is one binary reading its own argv[0], so they answer
          # alike -- but a partial install is still a partial install, and each name a
          # gate calls has to be there.
          for t in mcopy mdir minfo mtype; do
            assert_banner mtools "$t (GNU mtools) 4.0.49" "$mt/bin/$t" --version
          done

      # The archive round-trip gate cross-checks a surviving xattr with `getfattr`
      # (the `attr` package), which the require-env below turns from a soft skip into a
      # hard requirement. Install it so that gate actually runs rather than failing as
      # a missing tool.
      - name: Install attr for the getfattr xattr gate
        run: sudo apt-get update && sudo apt-get install -y attr

      # `--all-features` builds the `tar` archive source and the `dir` directory source,
      # so their PAX/xattr/ACL surface is tested, linted, and doc-checked rather than
      # shipping unexercised.
      # `--profile ci` is `release` with `debug-assertions` and `overflow-checks` back
      # on (see the workspace Cargo.toml): optimized, because the host-tool gates build
      # multi-gigabyte images and the >2^32-block tier streams a 9 TiB filesystem, but
      # still checking the on-disk invariants the library asserts and the arithmetic it
      # would otherwise wrap.
      # `--no-fail-fast` so a red run reports every target rather than stopping at the
      # first: the targets are a dozen, they are independent, and a run that names one
      # failure when there are three costs two more round trips to find out.
      - name: Test
        run: cargo test --workspace --all-features --profile ci --no-fail-fast
        env:
          FERROSYS_REQUIRE_HOST_TOOLS: "1"

      # The CLI depends on ferrosys with the `tar` feature on, so every build that
      # includes it has that feature enabled. Nothing else would then ever build the
      # library on its own, and the claim that its base build carries only `thiserror`
      # would stop being checked. This checks it.
      #
      # `test`, not `check`: the base build is a configuration a consumer selects, and
      # the family-agnostic root has behavior of its own — the crc32c primitive and the
      # negative answers `detect` gives with no family compiled in. Every other gate here
      # needs the formatter to build a fixture, so this is the only run those cases get.
      - name: Base library builds and passes its tests without the archive source
        run: cargo test -p ferrosys --no-default-features --lib

      # A family that is not the default one, alone. The CLI names every family, so every
      # other build here has `ext` on, and an item gated on `ext` where it meant "any
      # family" is invisible in all of them — it compiles, and it simply is not there in
      # the one configuration a FAT-only consumer selects. This is that configuration.
      - name: Library builds and passes its tests with FAT as the only family
        run: cargo test -p ferrosys --no-default-features --features fat --lib

      # The same family with a source and a sink over it, and still no ext. A tree goes into
      # a FAT volume and comes back out, through types that belong to no family — so an
      # extraction surface quietly tied to one is a build failure here rather than a type a
      # consumer cannot name. The configuration exists at all only because none of `tar`,
      # `dir`, and `serde` enables a family.
      - name: Library builds and passes its tests with a family and no ext
        run: cargo test -p ferrosys --no-default-features --features fat,dir --lib

      # The fuzz package sets its own `[workspace]`, so `cargo test --workspace` never
      # compiles it: a target that stopped matching the reader's API would rot silently
      # and the never-panic contract would go unfuzzed without anything failing. Type-check
      # it here. This needs no nightly and no sanitizer — running the fuzzer does, but
      # keeping the targets compiling is what a per-commit gate can guarantee.
      - name: Fuzz targets still type-check
        run: cargo check --manifest-path crates/ferrosys/fuzz/Cargo.toml --all-targets

      # A seed that no longer opens is a seed that fuzzes nothing, and the corpus is the
      # one part of the fuzzing setup with no compiler to catch its drift. `inspect`
      # exits 0 or 4 (a bad image is still a described image); anything else — an
      # operational failure, a usage error, a panic — means the seed is unreadable.
      #
      # `inspect` renders ext images, so the `reader_*` directories go through it. Every
      # seed of every family, these included, is also opened and walked in process by
      # `tests/seam.rs`, which needs no command and knows no family.
      - name: Fuzz seeds are still readable images
        run: |
          cargo build -p ferrosys-cli
          for seed in crates/ferrosys/fuzz/seeds/reader_*/*.img; do
            # `inspect` exits 4 on a readable-but-unsound image, which this gate
            # accepts. The step runs under `set -e`, so capture the status through
            # `|| status=$?` -- a bare call that returned 4 would abort the step
            # before the `case` could accept it.
            status=0
            ./target/debug/ferrosys inspect "$seed" > /dev/null 2>&1 || status=$?
            case $status in
              0|4) ;;
              *) echo "::error::seed $seed is not a readable image (exit $status)"; exit 1 ;;
            esac
          done

      # The archive seed has the same problem and needs the other half of the pipeline to
      # check it: an archive the parser refuses seeds a fuzzer that never frames a member,
      # and a tar header carries a checksum over its own bytes, so a mutation almost never
      # recovers one. Formatting from it exercises the parse and the entry conversion both,
      # and its generator is asserted to still reproduce it byte for byte.
      - name: Fuzz archive seed still parses, and reproduces from its generator
        run: |
          for seed in crates/ferrosys/fuzz/seeds/archive_parse/*.tar; do
            ./target/debug/ferrosys format --size 32M --from-tar "$seed" \
              --uuid f0e17055-0000-4000-8000-000000000000 --time 1700000000 \
              /tmp/archive-seed.img > /dev/null \
              || { echo "::error::seed $seed no longer parses"; exit 1; }
          done
          python3 crates/ferrosys/fuzz/make-archive-seed.py /tmp/regenerated.tar > /dev/null
          cmp /tmp/regenerated.tar crates/ferrosys/fuzz/seeds/archive_parse/rootfs-pax.tar \
            || { echo "::error::make-archive-seed.py no longer reproduces the seed"; exit 1; }

      # `--document-private-items` is what makes this gate cover the whole tree. A doc
      # comment on a private item is not rendered into the published reference, so a
      # broken link in one is invisible to a run without this flag — and the crate is
      # mostly private items. The site the docs workflow publishes is built without it.
      - name: Rustdoc
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: dependency advisories + licenses
    runs-on: ubuntu-latest
    env:
      # Pinned; bump deliberately, and update the digest with it. This step puts a binary
      # on PATH whose verdict decides whether the dependency graph is acceptable, so what
      # it runs is asserted rather than taken on trust from a redirect.
      #
      # One digest per architecture the gate can run on. A hosted runner is x86_64 and a
      # self-hosted one need not be, and a single pinned digest is not a portability
      # inconvenience there but a gate that cannot run at all on the other machine.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256_X86_64: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
      CARGO_DENY_SHA256_AARCH64: "995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - name: Install cargo-deny
        run: |
          mkdir -p "$HOME/.local/bin"
          # An architecture with no pinned digest fails rather than falling back to one
          # that would not verify: a gate that could not run is a failure, not a pass.
          case "$(uname -m)" in
            x86_64)
              triple="x86_64-unknown-linux-musl"
              digest="$CARGO_DENY_SHA256_X86_64" ;;
            aarch64)
              triple="aarch64-unknown-linux-musl"
              digest="$CARGO_DENY_SHA256_AARCH64" ;;
            *)
              echo "::error::no cargo-deny digest pinned for $(uname -m)"; exit 1 ;;
          esac
          tarball="cargo-deny-${CARGO_DENY_VERSION}-${triple}.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${digest}  ${tarball}" | sha256sum -c - \
            || { echo "::error::cargo-deny tarball digest mismatch"; exit 1; }
          tar -xzf "$tarball" --strip-components=1 -C "$HOME/.local/bin" \
            --wildcards '*/cargo-deny'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The advisory database is fetched at check time rather than cached: a cached copy
      # makes this gate pass for the wrong reason, and the whole value of it is that it
      # knows something today that it did not know at the last push.
      #
      # Two invocations, because the fuzz package declares its own `[workspace]` and a
      # check rooted here never reaches its graph — the same reason the fuzz targets get
      # a type-check step of their own above. Both read the one `deny.toml`.
      #
      # `--allow license-exception-not-encountered`: that one config serves two graphs
      # that do not carry the same crates, so the fuzz package's license exception is
      # unmatched here and this workspace's allowances are unmatched there. An entry that
      # the other graph needs is not a stale entry.
      - name: Dependencies carry no known advisory, and no license this crate cannot grant
        run: |
          cargo deny check --allow license-exception-not-encountered
          cargo deny --manifest-path crates/ferrosys/fuzz/Cargo.toml --config deny.toml \
            check --allow license-exception-not-encountered

  cross:
    name: cross-target check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library's directory source is Linux's, and the CLI reaches it. Nothing
          # else in either crate is platform-specific, so what these two prove is that
          # `cargo add ferrosys` and `cargo install ferrosys-cli` compile off Linux —
          # which no other job here builds, and which a published crate makes visible
          # the moment someone tries it.
          - target: x86_64-apple-darwin
            # macOS carries `std::os::unix`, so the gates compile there too and the
            # check covers them.
            flags: --all-targets
          - target: x86_64-pc-windows-msvc
            # Windows does not, and the gates are Unix by construction — they set unix
            # permissions, build device nodes, and shell out to `e2fsck`. What is
            # checked here is what a consumer compiles: the library and the binary.
            flags: ""
          # A 32-bit target, where `usize` is the narrow one: the crate models that case
          # deliberately (an image larger than the address space is a typed error, and
          # every on-disk length an image claims is added under a checked width), and
          # nothing else in this workflow compiles it.
          - target: i686-unknown-linux-gnu
            flags: --all-targets
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      # `check`, not `build`: it type-checks the whole crate graph for the target
      # without needing that platform's linker, which is the whole of what is being
      # asked here.
      - name: Check
        run: cargo check --workspace --all-features --target "${{ matrix.target }}" ${{ matrix.flags }}

  public-api:
    name: public API surface
    runs-on: ubuntu-latest
    env:
      # Pinned; bump deliberately. rustdoc's JSON output is nightly-only and its schema
      # is versioned — ci/public-api.py asserts the version it was written against, so a
      # bump here that moves the schema fails the job rather than re-rendering the
      # surface through a misread document.
      FERROSYS_API_NIGHTLY: "nightly-2026-07-09"
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly for rustdoc JSON
        run: rustup toolchain install "$FERROSYS_API_NIGHTLY" --profile minimal --no-self-update

      # The on-disk bytes have e2fsprogs as an oracle; the public API surface has this.
      # A `pub` item that leaks through a glob re-export, a field that disappears, an
      # enum that loses `#[non_exhaustive]` — none of those fail a build, and all are
      # breaking changes once the crate is published.
      - name: Public API matches its snapshot
        run: ci/public-api.sh

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify the crate still builds on the declared floor (Cargo.toml
      # `rust-version`). Keep this toolchain version in lockstep with that field.
      # The explicit `+toolchain` selector overrides rust-toolchain.toml.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: cargo check on MSRV
        run: cargo +1.88.0 check --all-targets --all-features

  book:
    name: mdbook build + test
    runs-on: ubuntu-latest
    env:
      # Pinned; bump deliberately. 0.5.x is required for `[rust] edition = 2024`.
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v4

      # `mdbook test` spawns `rustdoc` from a temporary directory, where rustup's
      # directory-based override does not apply — so it would pick the runner's default
      # toolchain while cargo builds the crate with the pinned one, and every guide
      # example would fail to link against a crate "compiled by an incompatible version
      # of rustc". Naming the toolchain explicitly for the whole job settles it, and
      # reading the name out of rust-toolchain.toml keeps the pin in one place.
      - name: Toolchain
        run: |
          rustup show
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          # As with cargo-deny in the `deny` job: the host architecture decides the asset,
          # and one with no build named here fails rather than guessing. The two are not
          # the same triple — mdBook publishes gnu for x86_64 and musl for aarch64.
          case "$(uname -m)" in
            x86_64)  triple="x86_64-unknown-linux-gnu" ;;
            aarch64) triple="aarch64-unknown-linux-musl" ;;
            *) echo "::error::no mdbook build named for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-${triple}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The guide's Rust code blocks link against the crate, so build it first. Every
      # family the guide has examples for is named here: a family the crate it links
      # against does not carry makes its examples fail to compile, and marking them
      # uncompiled instead would let them rot.
      - name: Build crate
        run: cargo build --features fat

      - name: Build book
        run: mdbook build book

      # Each Rust block opens with a hidden `extern crate ferrosys;`: rustdoc links a
      # crate it finds through `-L` only when a doctest names it that way, and mdbook
      # passes no `--extern`. Without the line the examples compile against nothing and
      # this gate passes while verifying nothing.
      - name: Test guide examples against the crate
        run: mdbook test book -L target/debug/deps
