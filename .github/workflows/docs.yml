name: Docs

# Builds one Pages site: the mdbook guide at the root, the rustdoc API reference
# under /api. Requires the repository's Pages source to be set to "GitHub
# Actions" (Settings -> Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 0.5.x is required for `[rust] edition = 2024`.
  MDBOOK_VERSION: "0.5.4"
  # By digest as well as by version: a binary this workflow executes is pinned to its
  # bytes, not only to the release that names them. Same values as ci.yml's `book` job.
  MDBOOK_SHA256_X86_64: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
  MDBOOK_SHA256_AARCH64: "753e5c5c363ee8a56972344dcf91466f005a51db84a7aeffe427ae3ef83d6d44"

jobs:
  build:
    # Pages is GitHub's, and so are the actions that publish to it: `configure-pages`,
    # `upload-pages-artifact`, and `deploy-pages` exist on no other forge and are mirrored by
    # no other forge. Anywhere else the first of them does not resolve, and the run is red for
    # a site that host was never going to serve. So the site has one publisher, and the
    # condition below names it: this job runs there and skips everywhere else.
    #
    # `deploy` needs this job, so it skips with it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          # The host architecture decides the asset, and one with no digest pinned here
          # fails rather than falling back to one that would not verify. Kept identical to
          # the `book` job in ci.yml: the same download in two workflows is the same rule,
          # and it is wrong in both or neither.
          case "$(uname -m)" in
            x86_64)
              triple="x86_64-unknown-linux-gnu"
              digest="$MDBOOK_SHA256_X86_64" ;;
            aarch64)
              triple="aarch64-unknown-linux-musl"
              digest="$MDBOOK_SHA256_AARCH64" ;;
            *) echo "::error::no mdbook digest pinned for $(uname -m)"; exit 1 ;;
          esac
          tarball="mdbook-v${MDBOOK_VERSION}-${triple}.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          echo "${digest}  ${tarball}" | sha256sum -c - \
            || { echo "::error::mdbook tarball digest mismatch"; exit 1; }
          tar -xzf "$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build guide
        run: mdbook build book   # renders to book/book (default build-dir)

      - name: Build API reference
        run: cargo doc --no-deps --all-features   # include the `tar` archive source
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Assemble combined site
        run: |
          rm -rf site
          mkdir -p site/api
          cp -r book/book/. site/
          cp -r target/doc/. site/api/
          # /api lands on the crate's module root.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=ferrosys/index.html">\n' > site/api/index.html
          # rustdoc uses underscore paths; keep Jekyll from mangling them.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
