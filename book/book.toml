[book]
title = "ferrosys"
description = "A pure-Rust, rootless, cross-platform library for building and reading ext4, ext3, ext2, FAT32, FAT16, FAT12, exFAT and btrfs images deterministically."
authors = ["The ferrosys Authors"]
language = "en"
src = "src"

# `mdbook test` compiles the guide's Rust code blocks against the crate, so the
# examples stay in step with the API. The edition here matches the crate's.
[rust]
edition = "2024"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/gregordinary/ferrosys"

[output.html.playground]
# Examples link against the crate and cannot run in the browser sandbox.
runnable = false
