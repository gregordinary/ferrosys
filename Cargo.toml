[workspace]
resolver = "3"
members = ["crates/ferrosys-cli", "crates/ferrosys"]

[workspace.package]
version = "0.5.1"
edition = "2024"
# Minimum supported Rust version: the floor a consumer must have. Development
# builds on the newer toolchain pinned in rust-toolchain.toml; a dedicated CI job
# checks the crate still builds on this floor, so dev on the newer pin cannot
# silently raise it.
rust-version = "1.88"
# Permissive dual-license, the Rust-ecosystem norm for a library meant to be
# depended on widely.
license = "MIT OR Apache-2.0"
# Both crates share one guide, so the URL is declared once here and inherited. A
# registry links it from every crate's page.
homepage = "https://gregordinary.github.io/ferrosys/"
# Both crates come from one repository, so the URL is declared once here and
# inherited. A registry links it from every crate's page.
repository = "https://github.com/gregordinary/ferrosys"

# The profile the test suite runs under.
#
# Optimized, because the host-tool gates build multi-gigabyte images and one tier streams
# a 9 TiB filesystem — minutes of wall-clock at `opt-level = 0`. But an optimized profile
# alone compiles out exactly the checks a filesystem writer most wants in a test run: the
# `debug_assert!`s that guard on-disk invariants, and the arithmetic overflow checks that
# would otherwise let a wrong length wrap silently into a plausible one. Both are turned
# back on here, so speed costs no checking.
#
# A profile of its own rather than settings on `release`: `release` is what a consumer's
# `cargo install` builds, and what the suite needs from a test run is not what a shipped
# binary should carry.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
# Versions are pinned here; a crate lists one in its own [dependencies] only when
# a module actually uses it. Each requirement's floor is a release the workspace is checked
# against: `ci/minimal-versions.sh` resolves every direct dependency to its floor and checks
# every target there. A consumer whose own lockfile carries an older release is moved up to
# one this workspace has built, rather than unified onto one it never has.
thiserror = "2.0.21"
# default-features off: archive parsing (incl. PAX xattrs), no host-side xattr writes.
# The floor is above 0.4.44, the last release RUSTSEC-2026-0067 and RUSTSEC-2026-0068
# apply to.
tar = { version = "0.4.46", default-features = false }
# default-features off, `std` + `fs` on: the directory, node, ownership and
# extended-attribute calls the host-directory source and sink need, over the
# direct-syscall backend, with no C library in the tree.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
# default-features off, `std` + `derive` on: the `Serialize` implementations the `serde`
# feature adds, and nothing else — no deserialization, no runtime format.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# DEFLATE, behind the `zlib` feature. `#![forbid(unsafe_code)]` throughout, which is this
# crate's own bar, and no features at all: the decoder writes into a caller's buffer, which
# is the one entry point that needs no allocator, so the encoder and the `Vec`-returning
# helpers that `with-alloc` adds are not compiled, and neither is the SIMD checksum path.
miniz_oxide = { version = "0.9.1", default-features = false }
# Zstandard decoding, behind the `zstd` feature. default-features off leaves `std` on and
# `hash` off, which drops the `twox-hash` dependency along with the frame checksum it
# verifies: btrfs records its own crc32c over every sector of the compressed bytes, so what
# a frame's own checksum would cover is already covered by the checksum the reader verifies.
# It carries `unsafe` in a hand-written ring buffer, which is a departure from this crate's
# own bar and is stated here rather than left to be discovered. The feature is off by
# default, so a build that does not ask for Zstandard carries none of it.
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
# The `serde` feature's gate reads what the derives emit, so the shape a consumer sees is
# asserted rather than assumed. A development dependency only; never shipped.
serde_json = "1.0.151"
tempfile = "3.27.0"
proptest = "1.11.0"
# A second, independent LZO1X implementation, used only to *produce* streams the decoder in
# this crate is held against. Compression alone, so what it brings is the encoder; the
# decoder it also ships is never called, because a decoder checked against itself checks
# nothing. A development dependency, never shipped.
lzokay = { version = "2.0.1", default-features = false, features = ["compress", "std"] }
# The version is required alongside the path so `cargo publish` accepts the
# dependency: a published crate cannot carry a path-only dependency. At `0.x` the
# minor is the breaking axis, so `"0.5"` resolves `>=0.5.0, <0.6.0` — the published
# `ferrosys` a released `ferrosys-cli` builds against, and it moves with every
# version bump.
ferrosys = { path = "crates/ferrosys", version = "0.5" }
