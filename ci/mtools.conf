# The mtools configuration the FAT gates run under, pointed at by MTOOLSRC.
#
# mtools reads /etc/mtools.conf, then ~/.mtoolsrc, then whatever MTOOLSRC names, and a
# later file wins for every setting it states. So this file exists first to make the
# host's own configuration irrelevant: a machine that carries one cannot change what a
# gate observes, because everything a gate depends on is restated here.
#
# Every value below is mtools' own default. They are written out rather than left
# implicit for the two reasons a pin exists at all — a default is only a default until
# an upstream release changes it, and a setting stated here is one the host cannot
# reach. Each decides either what mtools writes into an image or what it reports about
# one, so each is part of what a gate's verdict means.
#
# No drive is defined. The gates address an image with `-i <file> ::`, which names the
# file directly, so a drive definition would be a second route to an image and a second
# thing to keep in step.

# Long names are the point of using mtools as a populator at all. With this set,
# mtools writes and reads 8.3 names only, and a gate checking that a long name
# survived would pass against an image that never carried one.
MTOOLS_NO_VFAT=0

# The numeric tail: whether a long name's companion short name is `LONGNA~1` rather
# than a bare truncation. On, because it is what every FAT writer does and what a
# reader has to cope with, so it is what a populated oracle image should contain.
MTOOLS_NAME_NUMERIC_TAIL=1

# The consistency checks mtools makes on a boot sector before it will touch an image.
# Turning them off would make mtools accept geometry it otherwise rejects — and mtools
# refusing an image this crate wrote is a finding, not an obstacle to route around.
MTOOLS_SKIP_CHECK=0

# The related workaround, which pads a FAT to a size a handful of old BIOSes wanted.
# Off, so a FAT's size is the one the geometry calls for and a comparison against it
# means what it says. Note that turning the check above off would force this on.
MTOOLS_FAT_COMPATIBILITY=0

# How `mdir` prints a timestamp, which the gates read. An ISO-ordered date and a
# 24-hour clock are unambiguous and sort correctly; the alternatives are neither.
MTOOLS_DATE_STRING="yyyy-mm-dd"
MTOOLS_TWENTY_FOUR_HOUR_CLOCK=1

# Whether an all-uppercase short name is displayed lowercased. Off, so what `mdir`
# prints is the content of the directory entry rather than a presentation of it.
MTOOLS_LOWER_CASE=0

# The OEM code page short names are transliterated through. 850 is mtools' default and
# the one this project pins; the scope line is that there is one such encoding rather
# than a matrix, and this is where the single value is stated.
DEFAULT_CODEPAGE=850
